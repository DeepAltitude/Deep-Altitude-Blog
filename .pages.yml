media:
  - name: images
    label: Images
    input: public/images
    output: /images
    categories: [image]
    extensions: [jpg, jpeg, png, webp, gif, avif]
    rename: safe

content:
  - name: articles
    label: Articles
    type: collection
    path: src/content
    format: yaml-frontmatter
    subfolders: true
    exclude:
      - pages
      - about.md
      - about-en.md
      - markdown-style-guide.md
    filename:
      template: "{year}-{month}-{day}-{title}.md"
      field: false
    operations:
      rename: false
    view:
      layout: list
      primary: title
      fields: [title, domain, language, pubDate]
      sort: [pubDate, title, domain]
      search: [title, description]
      default:
        sort: pubDate
        order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: domain
        label: Domain
        type: select
        required: true
        options:
          values:
            - {name: sportas, label: Sportas}
            - {name: kalbos, label: Kalbos}
            - {name: protas, label: Protas}
            - {name: darbas, label: Darbas}
            - {name: gyvenimas, label: Gyvenimas}
      - name: pubDate
        label: Date
        type: date
        required: true
        options:
          format: yyyy.MM.dd
      - name: language
        label: Language (optional)
        type: select
        description: New notes default to Lithuanian when this is left blank.
        options:
          values:
            - {name: lt, label: Lietuvių}
            - {name: en, label: English}
            - {name: mul, label: Lietuvių + English}
            - {name: es, label: Español}
            - {name: pt, label: Português}
            - {name: de, label: Deutsch}
            - {name: fr, label: Français}
            - {name: it, label: Italiano}
            - {name: ru, label: Русский}
            - {name: da, label: Dansk}
      - name: description
        label: Short description
        type: text
        options:
          maxlength: 300
      - name: heroImage
        label: Optional cover image
        type: image
        options:
          media: images
      - name: body
        label: Article
        type: rich-text
        required: true
        options:
          format: markdown
          media: images
          rename: safe
          switcher: true
      - name: principles
        label: Principles (optional)
        type: reference
        description: Select reusable ideas. Add a new idea in Principles first, then select it here.
        options:
          collection: principles
          multiple: true
          search: title
          value: "{path}"
          label: "{title}"
      - name: tags
        label: Tags (optional)
        type: string
        list: true
        description: Specific topics, such as paragliding, learning or career.
      - name: updatedDate
        label: Updated date (optional)
        type: date
        default: ""
        options:
          format: yyyy.MM.dd

  - name: principles
    label: Principles
    type: collection
    path: src/principles
    format: yaml-frontmatter
    subfolders: false
    exclude: [.gitkeep]
    filename:
      template: "{title}.md"
      field: false
    operations:
      rename: false
    view:
      primary: title
      fields: [title]
      sort: [title]
      search: [title, description]
      default:
        sort: title
        order: asc
    fields:
      - name: title
        label: Principle
        type: string
        required: true
      - name: description
        label: Short description (optional)
        type: text
      - name: body
        label: Explanation (optional)
        type: rich-text
        options: {format: markdown, media: false}

  - name: about
    label: About · Lietuvių
    type: file
    path: src/content/pages/about.md
    format: yaml-frontmatter
    operations: {delete: false}
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: body
        label: About
        type: rich-text
        options: {format: markdown, media: false}

  - name: about-en
    label: About · English
    type: file
    path: src/content/pages/about-en.md
    format: yaml-frontmatter
    operations: {delete: false}
    fields:
      - name: title
        label: Page title
        type: string
        required: true
      - name: description
        label: Description
        type: text
      - name: body
        label: About
        type: rich-text
        options: {format: markdown, media: false}

settings:
  content:
    merge: true
